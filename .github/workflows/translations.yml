name: Translation check

on:
  push:
    branches:
      - translation/russian
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-lint:
    name: Check Android translations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Run translation lint
        run: |
          chmod +x gradlew
          ./gradlew :mobile:lintStmobileDebug -PtranslationLint --no-daemon
