# Builds the signed MeeTube TV APKs from this branch (tv). The phone app lives on main.
# - Push a tag tv-vX.Y.Z or tv-vX.Y.Z-beta on tv, where X.Y.Z is versionName in smarttubetv/build.gradle and
#   CHANGELOG.md starts with "## X.Y.Z": publishes "MeeTube TV X.Y.Z" (a -beta tag: "MeeTube TV X.Y.Z Beta",
#   as a pre-release) with the armeabi-v7a, arm64-v8a and universal APKs. Its notes are a download table,
#   then the changelog entry.
# - A TV release is never marked Latest: the phone app's updater reads releases/latest/download/meetube.json.
# - Run it by hand (Actions > Release TV > Run workflow, on tv): builds and keeps the APKs as artifacts only.
# Secrets: the phone's release key (SIGNING_KEY, the .jks in base64, KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD).
# Every TV release must use the same key or installed TVs refuse the update.
name: Release TV

on:
  push:
    tags: [ "tv-v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::SIGNING_KEY secret is missing"; exit 1; fi
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableRelease

      - name: Collect APKs
        id: meta
        run: |
          mkdir dist
          cp smarttubetv/build/outputs/apk/ststable/release/*.apk dist/
          ls -l dist
          echo "version=$(grep -oP 'versionName "\K[0-9]+\.[0-9]+\.[0-9]+' smarttubetv/build.gradle | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Keep APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeeTube TV ${{ steps.meta.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/tv-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tagged="${TAG#tv-v}"
          number="${tagged%%-*}"
          if [ "$number" != "$VERSION" ]; then echo "::error::tag $TAG does not match versionName $VERSION"; exit 1; fi
          for abi in armeabi-v7a arm64-v8a universal; do test -f "dist/MeeTubeTV_${number}_${abi}.apk"; done
          title="MeeTube TV $number"
          prerelease=""
          case "$tagged" in *-beta*) title="$title Beta"; prerelease="--prerelease";; esac
          # This version's CHANGELOG.md section without its heading ("## 0.0.1 Beta").
          awk -v h="## $number" '$0 == h || index($0, h " ") == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > changes.md
          test -s changes.md
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MeeTubeTV_${number}"
          {
            echo "### Download"
            echo
            echo "| Your TV | APK |"
            echo "| :-- | :-- |"
            echo "| **Most TVs and boxes** | [armeabi-v7a](${url}_armeabi-v7a.apk) |"
            echo "| **Newer 64-bit boxes** (Nvidia Shield, Google TV Streamer) | [arm64-v8a](${url}_arm64-v8a.apk) |"
            echo "| **Universal** (not sure? this one works on all) | [universal](${url}_universal.apk) |"
            echo
            cat changes.md
          } > notes.md
          # --latest=false: the phone app's updater reads releases/latest, which must stay a phone release.
          gh release create "$TAG" dist/MeeTubeTV_*.apk --title "$title" --notes-file notes.md --target "$GITHUB_SHA" --latest=false $prerelease
