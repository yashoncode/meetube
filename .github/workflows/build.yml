# Builds MeeTube on every push to main or staging, on pull requests, and by hand
# (Actions > Build > Run workflow). It only builds: releases come from release.yml on a v* tag.
# With the signing secrets (same as release.yml) it builds the signed release APKs, without them
# (pull requests from forks) a debug build. The APKs are kept as the run's artifact for 14 days.
name: Build

on:
  push:
    branches: [ main, staging ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Signing key
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "type=Debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "type=Release" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobile${{ steps.sign.outputs.type }}

      - name: Collect APKs
        id: meta
        run: |
          mkdir dist
          type=${{ steps.sign.outputs.type }}
          src=mobile/build/outputs/renamed_apks/stmobile$type
          [ -d "$src" ] || src=mobile/build/outputs/apk/stmobile/${type,,}
          cp "$src"/*.apk dist/
          name=$(grep -oP 'versionName "\K[0-9]+\.[0-9]+\.[0-9]+[^"]*' mobile/build.gradle | tail -n 1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### MeeTube $name (${{ steps.sign.outputs.type }})"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo
            echo "| APK | Size |"
            echo "|---|---|"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeeTube ${{ steps.meta.outputs.name }} ${{ steps.sign.outputs.type }} ${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error
