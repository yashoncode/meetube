name: Translation check and debug APK

on:
  push:
    branches:
      - translation/russian
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation:
    name: Lint translations and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Check translated strings
        run: |
          chmod +x gradlew
          ./gradlew :mobile:lintStmobileDebug -PtranslationLint --no-daemon

      - name: Build Russian debug APKs
        run: ./gradlew :mobile:assembleStmobileDebug --no-daemon

      - name: Upload installable APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeeTube-Russian-${{ github.sha }}
          path: mobile/build/outputs/renamed_apks/stmobileDebug/*.apk
          if-no-files-found: error
          retention-days: 14
